<body>
    <div class="page-shell">

        </header>

        <aside class="sidebar">
            <nav class="sidebar-nav" aria-label="Primary">

                <a href="about.html">About</a>
                <a href="photo_portfolio_home.html">Photos</a>
                <a href="video_portfolio.html" class="active">Video</a>

        <section class="feature-panel" aria-label="Video Section">
            <div class="video-grid" aria-label="Video gallery">
                <article class="video-card">
 <div class="video-wrapper">
    <a href="https://youtu.be/5MeKfC0kwu4" target="_blank" title="Featured video 1">

</article>

        </section>
        <section class="background-content">

    </div>
    <script>
document.addEventListener('DOMContentLoaded', () => {
   const header = document.querySelector('.hero-header');
  const sidebar = document.querySelector('.sidebar');
  const btn = document.querySelector(".menu-toggle");

  if (!header || !sidebar || !btn) return;

  function updateSidebarTop() {
    if (window.innerWidth <= 800) { // only for small screens
      const height = header.offsetHeight;
      sidebar.style.top = height + "px";
    } else {
      sidebar.style.top = ""; // reset for wide screens
    }
  }

  window.addEventListener('resize', updateSidebarTop);
  updateSidebarTop();

  btn.addEventListener("click", () => {
    sidebar.classList.toggle("open");
    });
});
</script>
</body>
</html>
