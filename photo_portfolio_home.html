<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Categories - Beyond The Frames</title>
    <link rel="stylesheet" href="static/photo.css">
</head>
<body>
    <div class="page-shell">
        <header class="hero-header">
            
              <button class="menu-toggle">☰</button> <!-- Left side -->
    
    <div class="left-group">
        <p class="welcome">Welcome</p>
        <span class="to">to</span>
    </div>

    <h1>Beyond The Frames</h1>
    <img class="logo" src="static/media/g5Final.png" alt="Logo">
</header>

        <aside class="sidebar">
            <nav class="sidebar-nav" aria-label="Primary">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="photo_portfolio_home.html" class="active">Photos</a>
                <a href="video_portfolio.html">Video</a>
            </nav>
        </aside>

        <section class="feature-panel" aria-label="Photo category highlights">
            <div id="categoryGrid" class="category-grid" aria-live="polite"></div>
        </section>

       <section class="background-content">
            <img src="static/media/Tree-3.jpg" alt="Featured portfolio preview">
        </section>
    </div>

    <script src="static/photo-data.js"></script>
    <script>
        const categoryGrid = document.getElementById("categoryGrid");
        const categories = Object.keys(PHOTO_CATALOG).sort((a, b) => a.localeCompare(b));

        categories.forEach((categoryName) => {
            const photos = PHOTO_CATALOG[categoryName] || [];
            if (photos.length === 0) {
                return;
            }

            const firstImage = photos[0];
            const card = document.createElement("a");
            card.className = "category-card";
            card.href = "photo_portfolio.html?category=" + encodeURIComponent(categoryName);
            card.setAttribute("aria-label", "Open " + categoryName + " photos");

            const image = document.createElement("img");
            image.loading = "lazy";
            image.src = "static/media/" + encodeURIComponent(categoryName) + "/" + encodeURIComponent(firstImage);
            image.alt = categoryName + " highlight image";

            const label = document.createElement("span");
            label.textContent = categoryName;

            card.appendChild(image);
            card.appendChild(label);
            categoryGrid.appendChild(card);
        });
        document.addEventListener('DOMContentLoaded', () => {
   const header = document.querySelector('.hero-header');
  const sidebar = document.querySelector('.sidebar');
  const btn = document.querySelector(".menu-toggle");

  if (!header || !sidebar || !btn) return;

  function updateSidebarTop() {
    if (window.innerWidth <= 800) { // only for small screens
      const height = header.offsetHeight;
      sidebar.style.top = height + "px";
    } else {
      sidebar.style.top = ""; // reset for wide screens
    }
  }

  window.addEventListener('resize', updateSidebarTop);
  updateSidebarTop();

  btn.addEventListener("click", () => {
    sidebar.classList.toggle("open");
    });
});
    </script>
</body>
</html>
